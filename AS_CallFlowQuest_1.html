<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Call Flow Quest | Appointment Setter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Century+Gothic&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sky:#5EC8F2;--sky-deep:#2E9FDB;
  --pixel:'Press Start 2P',monospace;
  --font:'Century Gothic','Trebuchet MS',Arial,sans-serif;
}
body{
  font-family:var(--font);
  background:linear-gradient(#5EC8F2 0%,#8FD8F5 55%,#B8E8F5 100%);
  min-height:100vh;overflow-x:hidden;
}
.demo-tag{position:fixed;bottom:8px;right:8px;background:#2E2E2E;color:#fff;font-family:var(--pixel);font-size:8px;padding:6px 10px;border-radius:4px;z-index:999;opacity:.85;}

/* CLOUDS */
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.9;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}

/* ───────── WORLD MAP SCREEN ───────── */
#worldMap{position:relative;min-height:100vh;padding:30px 20px 60px;}
.wm-header{text-align:center;margin-bottom:10px;position:relative;z-index:2;}
.wm-title{font-family:var(--pixel);font-size:22px;color:#fff;text-shadow:3px 3px 0 #0A3542;margin-bottom:10px;}
.wm-sub{font-family:var(--font);font-size:14px;color:#0A3542;font-weight:700;background:rgba(255,255,255,.7);display:inline-block;padding:6px 16px;border-radius:20px;}
.hud{display:flex;justify-content:center;gap:24px;margin:16px 0 30px;position:relative;z-index:2;}
.hud-item{background:#0A3542;color:#fff;font-family:var(--pixel);font-size:11px;padding:10px 16px;border-radius:8px;border-bottom:4px solid #061F28;display:flex;align-items:center;gap:8px;}

.path-wrap{max-width:780px;margin:0 auto;position:relative;z-index:2;}
.level-node{
  display:flex;align-items:center;gap:18px;margin-bottom:8px;cursor:pointer;
  padding:14px;border-radius:14px;transition:transform .15s;
}
.level-node:hover{transform:translateX(6px);}
.level-node.locked{cursor:not-allowed;opacity:.55;}
.ln-badge{
  width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.2);position:relative;
}
.ln-badge.done::after{content:'⭐';position:absolute;top:-10px;right:-10px;font-size:22px;}
.ln-badge.locked{background:#8a99a0!important;}
.ln-info{background:#fff;border-radius:12px;padding:10px 18px;flex:1;box-shadow:0 4px 0 rgba(0,0,0,.08);}
.ln-num{font-family:var(--pixel);font-size:9px;color:#999;}
.ln-name{font-size:15px;font-weight:700;color:#0A3542;}
.ln-status{font-family:var(--pixel);font-size:8px;color:#0B7A4E;}
.ln-status.locked-text{color:#999;}

.connector-path{position:absolute;left:32px;top:76px;width:4px;background:repeating-linear-gradient(#fff 0,#fff 8px,transparent 8px,transparent 16px);z-index:1;}

/* ───────── LEVEL SCREEN ───────── */
#levelScreen{display:none;min-height:100vh;position:relative;padding:20px;}
.level-hud{display:flex;justify-content:space-between;align-items:center;max-width:820px;margin:0 auto 14px;position:relative;z-index:3;}
.back-btn{font-family:var(--pixel);font-size:9px;background:#0A3542;color:#fff;border:none;border-radius:6px;padding:9px 14px;cursor:pointer;border-bottom:3px solid #061F28;}
.lives{display:flex;gap:4px;}
.heart{font-size:20px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.3));}
.coin-count{font-family:var(--pixel);font-size:11px;background:#F0B429;color:#5c3d00;padding:8px 14px;border-radius:8px;border-bottom:3px solid #b8860b;}

.game-stage{
  max-width:820px;margin:0 auto;background:linear-gradient(#87CEEB,#B8E8F5 70%,#DFF3D8 70%,#DFF3D8 100%);
  border-radius:16px;border:5px solid #fff;position:relative;overflow:hidden;min-height:420px;
  box-shadow:0 10px 0 rgba(0,0,0,.15);
}
.ground{position:absolute;bottom:0;left:0;right:0;height:34%;background:repeating-linear-gradient(90deg,#C99A5B 0,#C99A5B 38px,#B8824A 38px,#B8824A 40px);border-top:6px solid #7CB342;}
.platform{position:absolute;height:22px;border-radius:5px;background:repeating-linear-gradient(90deg,#D9A857 0,#D9A857 20px,#C99245 20px,#C99245 22px);box-shadow:0 4px 0 rgba(0,0,0,.15);}

.hero{position:absolute;width:44px;height:52px;transition:left .5s cubic-bezier(.3,.9,.4,1.3),bottom .4s ease;z-index:5;}
.hero-body{width:100%;height:100%;position:relative;}
.hero-body .cap{position:absolute;top:0;left:4px;width:36px;height:16px;background:var(--sky-deep);border-radius:10px 10px 0 0;}
.hero-body .face{position:absolute;top:12px;left:6px;width:32px;height:20px;background:#FFD9B3;border-radius:10px;}
.hero-body .eyes{position:absolute;top:18px;left:12px;width:20px;display:flex;justify-content:space-between;}
.hero-body .eyes span{width:4px;height:4px;background:#222;border-radius:50%;}
.hero-body .torso{position:absolute;top:30px;left:2px;width:40px;height:22px;background:#F4F8FB;border-radius:8px 8px 4px 4px;border:2px solid #0A3542;}
.hero.jump{animation:heroJump .5s ease;}
@keyframes heroJump{0%{transform:translateY(0);}40%{transform:translateY(-46px);}100%{transform:translateY(0);}}
.hero.bounce{animation:heroBounce .4s ease;}
@keyframes heroBounce{0%,100%{transform:translateX(0);}30%{transform:translateX(-14px) rotate(-8deg);}60%{transform:translateX(6px) rotate(4deg);}}

.flagpole{position:absolute;bottom:34%;right:36px;width:6px;height:190px;background:#8a8a8a;}
.flagpole .flag{position:absolute;top:6px;left:6px;width:34px;height:24px;background:#0B7A4E;clip-path:polygon(0 0,100% 20%,0 40%);}

.coin{position:absolute;font-size:26px;animation:coinSpin 1s linear infinite,coinFloat 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
@keyframes coinSpin{0%{transform:scaleX(1);}50%{transform:scaleX(.2);}100%{transform:scaleX(1);}}
@keyframes coinFloat{0%,100%{margin-top:0;}50%{margin-top:-8px;}}
.coin.collected{animation:coinCollect .5s ease forwards;}
@keyframes coinCollect{to{transform:translateY(-60px) scale(1.6);opacity:0;}}

.question-panel{
  background:#fff;border-radius:14px;padding:20px 22px;max-width:820px;margin:16px auto 0;
  box-shadow:0 6px 0 rgba(0,0,0,.1);position:relative;z-index:3;
}
.qp-stage-label{font-family:var(--pixel);font-size:9px;margin-bottom:10px;}
.qp-question{font-size:16px;font-weight:700;color:#0A3542;margin-bottom:16px;line-height:1.4;}
.qp-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:640px){.qp-options{grid-template-columns:1fr;}}
.qp-opt{
  background:#F4F8FB;border:2px solid #D8E4EA;border-radius:10px;padding:12px 14px;font-size:13.5px;
  cursor:pointer;transition:all .15s;text-align:left;color:#1A2A32;
}
.qp-opt:hover{border-color:#00AEEF;background:#EAF6FD;}
.qp-opt.correct{background:#E3F5EC;border-color:#0B7A4E;color:#0A4A32;font-weight:700;}
.qp-opt.wrong{background:#FDECEB;border-color:#B5251B;color:#6B2A24;}
.qp-opt[disabled]{cursor:default;}

.result-banner{
  text-align:center;padding:12px;border-radius:10px;font-family:var(--pixel);font-size:11px;margin-top:14px;display:none;
}
.result-banner.show{display:block;}
.result-banner.good{background:#0B7A4E;color:#fff;}
.result-banner.bad{background:#B5251B;color:#fff;}
.next-level-btn{
  display:none;margin:14px auto 0;font-family:var(--pixel);font-size:11px;background:#F0B429;color:#5c3d00;
  border:none;border-radius:8px;padding:12px 22px;cursor:pointer;border-bottom:4px solid #b8860b;
}
.next-level-btn.show{display:block;}

/* ───────── END SCREENS ───────── */
#winScreen,#loseScreen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;}
.end-card{background:#fff;border-radius:20px;padding:40px 34px;max-width:460px;box-shadow:0 14px 0 rgba(0,0,0,.15);position:relative;overflow:hidden;}
.end-emoji{font-size:60px;margin-bottom:10px;}
.end-title{font-family:var(--pixel);font-size:16px;color:#0A3542;margin-bottom:14px;line-height:1.6;}
.end-score{font-family:var(--pixel);font-size:24px;color:#F0B429;margin-bottom:6px;}
.end-sub{font-size:13px;color:#5A6E78;margin-bottom:20px;}
.retry-btn{font-family:var(--pixel);font-size:11px;background:#00AEEF;color:#fff;border:none;border-radius:8px;padding:14px 26px;cursor:pointer;border-bottom:4px solid #0090C4;}
.confetti-p{position:absolute;top:-8%;font-size:20px;pointer-events:none;animation:confFall linear forwards;}
@keyframes confFall{to{transform:translateY(560px) rotate(340deg);opacity:0;}}
</style>
</head>
<body>

<!-- ═══ WORLD MAP ═══ -->
<div id="worldMap">
  <div class="cloud" style="width:90px;height:34px;top:40px;left:6%;"></div>
  <div class="cloud" style="width:70px;height:26px;top:120px;right:8%;"></div>
  <div class="cloud" style="width:60px;height:22px;top:320px;left:4%;"></div>

  <div class="wm-header">
    <div class="wm-title">🎮 CALL FLOW QUEST</div>
    <div class="wm-sub">New Lead Opener — practice all 8 stages, one level at a time</div>
  </div>

  <div class="hud">
    <div class="hud-item">🪙 <span id="mapCoins">0</span></div>
    <div class="hud-item">🏆 <span id="mapStars">0</span>/8</div>
  </div>

  <div class="path-wrap" id="pathWrap"></div>
</div>

<!-- ═══ LEVEL SCREEN ═══ -->
<div id="levelScreen">
  <div class="level-hud">
    <button class="back-btn" onclick="backToMap()">← MAP</button>
    <div class="lives" id="livesDisplay"></div>
    <div class="coin-count">🪙 <span id="levelCoins">0</span></div>
  </div>

  <div class="game-stage" id="gameStage">
    <div class="ground"></div>
    <div class="platform" id="platformA" style="left:20px;bottom:36%;width:110px;"></div>
    <div class="platform" id="platformB" style="right:120px;bottom:50%;width:110px;"></div>
    <div class="flagpole"><div class="flag"></div></div>
    <div class="hero" id="hero" style="left:24px;bottom:34%;"><div class="hero-body"><div class="cap"></div><div class="face"></div><div class="eyes"><span></span><span></span></div><div class="torso"></div></div></div>
    <div id="coinHost"></div>
  </div>

  <div class="question-panel">
    <div class="qp-stage-label" id="qpStageLabel"></div>
    <div class="qp-question" id="qpQuestion"></div>
    <div class="qp-options" id="qpOptions"></div>
    <div class="result-banner" id="resultBanner"></div>
    <button class="next-level-btn" id="nextLevelBtn" onclick="goNextLevel()">CONTINUE →</button>
  </div>
</div>

<!-- ═══ WIN SCREEN ═══ -->
<div id="winScreen">
  <div class="end-card" id="winCard">
    <div class="end-emoji">🏆</div>
    <div class="end-title">QUEST<br>COMPLETE!</div>
    <div class="end-score" id="finalCoins">0 🪙</div>
    <div class="end-sub">All 8 stages cleared. You know the flow — now go run it on a live call.</div>
    <button class="retry-btn" onclick="restartQuest()">PLAY AGAIN</button>
  </div>
</div>

<!-- ═══ LOSE SCREEN ═══ -->
<div id="loseScreen">
  <div class="end-card">
    <div class="end-emoji">💥</div>
    <div class="end-title">OUT OF<br>LIVES!</div>
    <div class="end-sub" id="loseSub">You made it partway through. Have another go — you'll remember more this time.</div>
    <button class="retry-btn" onclick="restartQuest()">TRY AGAIN</button>
  </div>
</div>

<div class="demo-tag">PRACTICE GAME</div>

<script>
const LEVELS = [
  { color:"#00AEEF", icon:"👋", name:"Intro", q:"A lead comes from a Google search on the website. What's the right opener?",
    opts:[
      "It's ___ here from RESINC — we had your details come through from one of our online ads...",
      "It's ___ here from RESINC SOLAR — you popped your details through on our website just [time period], how's it going?",
      "It's ___ here from RESINC — [Ambassador's name] mentioned you might be interested...",
      "Just launch straight into the pitch, no greeting needed",
    ], correct:1 },
  { color:"#E0664A", icon:"💸", name:"Bill Pain", q:"After establishing the bill amount, what should you ask about next?",
    opts:[
      "Immediately quote a system price",
      "What's driving the increases, then ask about the property and who lives there",
      "Whether they've considered switching retailers",
      "Skip straight to booking the appointment",
    ], correct:1 },
  { color:"#0E8074", icon:"📍", name:"Confirm Address", q:"Why confirm the property address at this stage?",
    opts:[
      "Just to make small talk",
      "To lock in the enquiry is for the correct property before continuing",
      "To try upselling a second property",
      "It's optional — skip it if you're short on time",
    ], correct:1 },
  { color:"#0B7A4E", icon:"🏠", name:"Roof Check", q:"While checking the roof via satellite, what else should you ask?",
    opts:[
      "Nothing else is needed",
      "Whether they're planning any drastic changes, like a knock-down rebuild, soon",
      "Their favourite roof colour",
      "The exact age of the roof in years",
    ], correct:1 },
  { color:"#D4940A", icon:"🏆", name:"Who is RESINC", q:"Why bring up RESINC's awards and reputation?",
    opts:[
      "Just to brag",
      "To build credibility and show you're not a fly-by-night operation",
      "It's unnecessary — skip this part",
      "To distract from the bill pain conversation",
    ], correct:1 },
  { color:"#6B4FBB", icon:"🛡️", name:"Pre-empt Objections", q:"How do you handle the affordability objection?",
    opts:[
      "Explain the funding options mean no money upfront, and savings help pay it off",
      "Tell them to save up first and call back later",
      "Avoid the topic entirely",
      "Ask them to pay in full immediately",
    ], correct:0 },
  { color:"#4F5FBB", icon:"📈", name:"Build Value", q:"What do you request before setting up the assessment?",
    opts:[
      "Their savings account balance",
      "A copy of their electricity bill",
      "A copy of their birth certificate",
      "Nothing — the specialist sorts it out later",
    ], correct:1 },
  { color:"#C23B7A", icon:"🎯", name:"Close & Lock In", q:"What should you always push for when booking the appointment time?",
    opts:[
      "A booking 2 weeks out, to be safe",
      "Within 72 hours, ideally next day",
      "Whatever time is easiest for you, the setter",
      "A time when neither decision-maker will be home",
    ], correct:1 },
];

let progress = JSON.parse(localStorage_get() || '{"unlocked":1,"stars":{}}');
function localStorage_get(){ try{ return null; }catch(e){ return null; } } // no persistence across sessions by design

let totalCoins = 0;
let currentLevel = 0;
let lives = 3;
let levelCoins = 0;
let answered = false;

// ── AUDIO ──
let actx = null;
function getCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq,dur,type,gain){
  const ctx = getCtx(); if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type||'square'; o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(gain||0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
  o.start(); o.stop(ctx.currentTime+dur);
}
function sfxCoin(){ beep(988,0.08,'square',0.07); setTimeout(()=>beep(1318,0.12,'square',0.07),60); }
function sfxJump(){ beep(440,0.12,'square',0.06); }
function sfxWrong(){ beep(180,0.25,'sawtooth',0.08); }
function sfxLevelWin(){ [660,880,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'square',0.08),i*90)); }
function sfxGameWin(){ [523,659,784,1046,1318,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.09),i*110)); }
function sfxLose(){ [400,340,280,220].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'sawtooth',0.08),i*130)); }

// ── WORLD MAP ──
function renderMap(){
  const wrap = document.getElementById('pathWrap');
  wrap.innerHTML = LEVELS.map((lv,i) => {
    const done = progress.stars[i];
    const locked = i > progress.unlocked - 1;
    return `
    <div class="level-node ${locked?'locked':''}" onclick="${locked?'':'startLevel('+i+')'}">
      <div class="ln-badge ${done?'done':''} ${locked?'locked':''}" style="background:${locked?'':lv.color};">${locked?'🔒':lv.icon}</div>
      <div class="ln-info">
        <div class="ln-num">STAGE ${i+1} OF 8</div>
        <div class="ln-name">${lv.name}</div>
        <div class="ln-status ${locked?'locked-text':''}">${locked?'LOCKED':(done?'★ CLEARED':'READY TO PLAY')}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('mapCoins').textContent = totalCoins;
  document.getElementById('mapStars').textContent = Object.keys(progress.stars).length;
}
renderMap();

function backToMap(){
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('worldMap').style.display = 'block';
  renderMap();
}

// ── LEVEL SCREEN ──
function startLevel(i){
  currentLevel = i;
  lives = 3;
  levelCoins = 0;
  answered = false;
  document.getElementById('worldMap').style.display = 'none';
  document.getElementById('levelScreen').style.display = 'block';
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('loseScreen').style.display = 'none';
  renderLives();
  renderLevel();
}

function renderLives(){
  document.getElementById('livesDisplay').innerHTML = Array(3).fill(0).map((_,i) => `<span class="heart">${i < lives ? '❤️' : '🖤'}</span>`).join('');
}

function shuffleOptions(lv){
  const indices = lv.opts.map((_,i) => i);
  for(let i = indices.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return {
    opts: indices.map(i => lv.opts[i]),
    correct: indices.indexOf(lv.correct),
  };
}

let currentShuffled = null;

function renderLevel(){
  answered = false;
  const lv = LEVELS[currentLevel];
  currentShuffled = shuffleOptions(lv);
  document.getElementById('gameStage').style.background = `linear-gradient(${lv.color}55, #B8E8F5 70%, #DFF3D8 70%, #DFF3D8 100%)`;
  document.getElementById('hero').style.left = '24px';
  document.getElementById('hero').className = 'hero';
  document.getElementById('coinHost').innerHTML = `<div class="coin" id="floatingCoin" style="left:50%;bottom:56%;">🪙</div>`;
  document.getElementById('levelCoins').textContent = levelCoins;

  document.getElementById('qpStageLabel').textContent = `STAGE ${currentLevel+1} — ${lv.name.toUpperCase()}`;
  document.getElementById('qpStageLabel').style.color = lv.color;
  document.getElementById('qpQuestion').textContent = lv.q;
  document.getElementById('qpOptions').innerHTML = currentShuffled.opts.map((o,i) => `<button class="qp-opt" onclick="pickOption(${i})">${o}</button>`).join('');
  document.getElementById('resultBanner').className = 'result-banner';
  document.getElementById('nextLevelBtn').className = 'next-level-btn';
}

function pickOption(i){
  if(answered) return;
  const lv = LEVELS[currentLevel];
  const correct = i === currentShuffled.correct;
  const opts = document.querySelectorAll('.qp-opt');

  const hero = document.getElementById('hero');
  const banner = document.getElementById('resultBanner');

  if(correct){
    answered = true;
    opts.forEach((el) => { el.disabled = true; });
    opts[i].classList.add('correct');
    sfxJump();
    hero.classList.add('jump');
    hero.style.left = '70%';
    setTimeout(() => {
      sfxCoin();
      const coin = document.getElementById('floatingCoin');
      if(coin) coin.classList.add('collected');
      levelCoins += 10;
      totalCoins += 10;
      document.getElementById('levelCoins').textContent = levelCoins;
    }, 350);
    banner.className = 'result-banner show good';
    banner.textContent = '✓ NICE! +10 COINS';
    setTimeout(() => {
      progress.stars[currentLevel] = true;
      progress.unlocked = Math.max(progress.unlocked, currentLevel + 2);
      sfxLevelWin();
      document.getElementById('nextLevelBtn').classList.add('show');
    }, 500);
  } else {
    // Wrong pick — don't reveal the correct answer, just mark this one wrong and let them keep trying
    opts[i].classList.add('wrong');
    opts[i].disabled = true;
    sfxWrong();
    hero.classList.add('bounce');
    setTimeout(() => hero.classList.remove('bounce'), 400);
    lives--;
    renderLives();
    if(lives <= 0){
      answered = true;
      opts.forEach((el) => { el.disabled = true; });
      banner.className = 'result-banner show bad';
      banner.textContent = '✗ OUT OF LIVES';
      setTimeout(() => showLose(), 900);
    } else {
      banner.className = 'result-banner show bad';
      banner.textContent = `✗ NOT QUITE — ${lives} ${lives===1?'LIFE':'LIVES'} LEFT, TRY AGAIN`;
      setTimeout(() => { banner.className = 'result-banner'; }, 1300);
    }
  }
}

function goNextLevel(){
  if(currentLevel < LEVELS.length - 1){
    currentLevel++;
    lives = Math.max(lives, 1);
    renderLives();
    renderLevel();
  } else {
    showWin();
  }
}

function showWin(){
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'flex';
  document.getElementById('finalCoins').textContent = totalCoins + ' 🪙';
  sfxGameWin();
  const card = document.getElementById('winCard');
  const emojis = ['🪙','⭐','🎉','🏆'];
  for(let i=0;i<28;i++){
    const s = document.createElement('div');
    s.className = 'confetti-p';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+'%';
    s.style.animationDuration = (2+Math.random()*1.4)+'s';
    s.style.animationDelay = (Math.random()*0.5)+'s';
    card.appendChild(s);
  }
}

function showLose(){
  document.getElementById('levelScreen').style.display = 'none';
  document.getElementById('loseScreen').style.display = 'flex';
  document.getElementById('loseSub').textContent = `You made it to Stage ${currentLevel+1} of 8 with ${totalCoins} coins. Have another go — you'll remember more this time.`;
  sfxLose();
}

function restartQuest(){
  totalCoins = 0;
  progress = {unlocked:1, stars:{}};
  document.getElementById('winScreen').style.display = 'none';
  document.getElementById('loseScreen').style.display = 'none';
  document.getElementById('worldMap').style.display = 'block';
  renderMap();
}
</script>
</body>
</html>
